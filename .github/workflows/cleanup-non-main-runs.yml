name: Cleanup non-main workflow runs

on:
  push:
    branches:
      - main

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs not on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.head_branch != "main") | .id' |
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" || true
          done
