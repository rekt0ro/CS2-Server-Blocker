name: Cleanup non-main workflow runs

on:
  push:
    branches:
      - main

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot and delete non-main runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.head_branch != "main") | .id')"
          for run_id in $ids; do
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id"
          done
